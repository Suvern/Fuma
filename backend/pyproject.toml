[project]
name = "fuma-backend"
version = "0.1.0"
description = "Fuma mobile package distribution API and workers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "pyyaml>=6,<7",
    "argon2-cffi>=23,<26",
    "cryptography>=44,<47",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.35,<1",
    "httpx2>=2,<3",
    "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7,<1",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/contracts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an isolated PostgreSQL test database"]
