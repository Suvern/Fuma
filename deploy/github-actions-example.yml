# Copy into the Android SOURCE repository as .github/workflows/build.yml.
# Configure Fuma rule workflow_path to that exact path; this is not Fuma's own CI.
name: Build Android Debug and notify Fuma
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload package to COS and enqueue Fuma notification
        shell: bash
        env:
          FUMA_CALLBACK_URL: ${{ vars.FUMA_CALLBACK_URL }}
          FUMA_CI_TOKEN: ${{ secrets.FUMA_CI_TOKEN }}
          FUMA_APP_ID: ${{ vars.FUMA_APP_ID }}
          FUMA_VERSION: ${{ vars.FUMA_VERSION }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          test -n "$FUMA_CALLBACK_URL"
          test -n "$FUMA_CI_TOKEN"
          test -n "$FUMA_APP_ID"
          sha256="$(sha256sum "$APK_PATH" | cut -d' ' -f1)"
          size="$(stat -c '%s' "$APK_PATH")"
          object_key="debug/${GITHUB_SHA}/$(basename "$APK_PATH")"
          manifest_key="debug/${GITHUB_SHA}/manifest.json"
          version="${FUMA_VERSION:-0.0.0}"
          build_number="${GITHUB_RUN_NUMBER}"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg schema_version "1" --arg platform android \
            --arg file_name "$(basename "$APK_PATH")" \
            '{schema_version:$schema_version,platform:$platform,file_name:$file_name}' \
            > "$RUNNER_TEMP/manifest.json"
          manifest_sha256="$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d' ' -f1)"
          # Replace this line with the approved COS CLI/action for your provider.
          echo "Upload $APK_PATH to $object_key and $RUNNER_TEMP/manifest.json to $manifest_key using the configured COS uploader"
          payload="$(jq -n \
            --arg event_id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg app_id "$FUMA_APP_ID" \
            --arg version "$version" \
            --arg build_number "$build_number" \
            --arg created_at "$created_at" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg channel debug \
            --arg object_key "$object_key" \
            --arg manifest_key "$manifest_key" \
            --argjson object_size "$size" \
            --arg object_sha256 "$sha256" \
            --arg manifest_sha256 "$manifest_sha256" \
            '{schema_version:"2",event_id:$event_id,app_id:$app_id,channel:$channel,build:{version:$version,build_number:$build_number,commit_sha:$commit_sha,workflow_run_id:$workflow_run_id,created_at:$created_at},object:{key:$object_key,size:$object_size,sha256:$object_sha256,etag:null,content_type:"application/vnd.android.package-archive"},manifest:{key:$manifest_key,sha256:$manifest_sha256}}')"
          status="$(curl --silent --show-error --fail-with-body --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer ${FUMA_CI_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" --output "${RUNNER_TEMP}/fuma-response.json" \
            --write-out '%{http_code}' "$FUMA_CALLBACK_URL")"
          test "$status" = 202
          jq '{event_id,duplicate,state}' "${RUNNER_TEMP}/fuma-response.json"
          # End this step now. Fuma validates the COS objects, parses the package, then sends the card.
