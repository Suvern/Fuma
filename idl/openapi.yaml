  /api/v1/downloads/{opaque_token}:
    get:
      operationId: get_download
      tags:
      - downloads
      summary: get download
      description: Opaque grant bearer access; token hash and deadline checked on every new request. Single
        byte range only. Existing transfer may finish after expiry. Redact token from all logs; never
        serve arbitrary paths.
      security: []
      responses:
        '200':
          description: Binary file stream
          headers:
            Content-Length:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not allowed or invalid CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: State conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Revision mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '206':
          description: Binary file stream
          headers:
            Content-Length:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '410':
          description: Expired or no longer available grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '416':
          description: Invalid or unsatisfiable single range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Content-Range:
              schema:
                type: string
              description: bytes */<full-size>
      x-access: public
      parameters:
      - name: opaque_token
        in: path
        required: true
        schema:
          type: string
      - name: Range
        in: header
        schema:
          type: string
        description: Single bytes range including suffix. Download handler parses all values and returns
          416 for malformed/multiple/unsatisfiable ranges, never request-schema 422.
    head:
      operationId: head_download
      tags:
      - downloads
      summary: head download
      description: Opaque grant bearer access; token hash and deadline checked on every new request. Single
        byte range only. Existing transfer may finish after expiry. Redact token from all logs; never
        serve arbitrary paths. HEAD ignores Range and returns full-file headers with 200; every HEAD response,
        including errors, has no body.
      security: []
      responses:
        '200':
          description: File headers only
          headers:
            Content-Length:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
            Content-Range:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        '401':
          description: Authentication required
        '403':
          description: Not allowed or invalid CSRF
        '404':
          description: Resource not available
        '409':
          description: State conflict
        '412':
          description: Revision mismatch
        '422':
          description: Invalid input
        '429':
          description: Rate limited
        '503':
          description: Dependency unavailable
        '410':
          description: Expired or no longer available grant
      x-access: public
      parameters:
      - name: opaque_token
        in: path
        required: true
        schema:
          type: string
