  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Query:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: ETag revision obtained from the resource; stale value returns 412.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id001
      description: Same intent and retries use the same UUID; different body with same key returns 409.
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: fuma_session
      description: Opaque HttpOnly session. Production cookie name __Host-fuma_session, Secure; local
        HTTP uses fuma_session. x-access determines required user kind. admin never implies Feishu download
        eligibility.
    ActionsToken:
      type: http
      scheme: bearer
      description: One rule-scoped CI token; cannot access management APIs.
    BrowserContextCookie:
      type: apiKey
      in: cookie
      name: fuma_browser
      description: Unprivileged anonymous browser context, production __Host-fuma_browser; HttpOnly, SameSite=Lax,
        Secure in HTTPS. Only binds CSRF and OAuth browser state; never authenticates admin or downloader.
