openapi: 3.1.0
info:
  title: Fuma M1 API
  version: 1.0.0
  description: Design-first M1 contract. YAML is authoritative; implementation coverage is checked separately.
    All timestamps UTC. Provider IDs are decimal strings. Error bodies never contain provider payloads
    or credentials.
servers:
- url: /
paths:
  /api/v1/health/live:
    get:
      description: Process liveness only; does not imply integrations or business features are ready.
      operationId: get_liveness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Liveness
      tags:
      - health
  /api/v1/health/ready:
    get:
      description: Check connectivity only, without disclosing connection strings or errors.
      operationId: get_readiness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Successful Response
        '404':
