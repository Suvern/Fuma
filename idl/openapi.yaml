        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageImport'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
  /api/v1/debug-entries/{id}/persist:
    post:
      operationId: persist_legacy_package
      tags:
      - PackageLibrary
      x-access: app-manager
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyPersistence'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
  /api/v1/apps/{id}/release-defaults/{platform}:
    get:
      operationId: get_release_default
      tags:
      - PackageLibrary
      x-access: app-manager
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: platform
        in: path
        required: true
        schema:
          type: string
          enum:
          - android
          - ios
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDefault'
    put:
      operationId: set_release_default
      tags:
      - PackageLibrary
      x-access: app-manager
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: platform
        in: path
        required: true
        schema:
          type: string
          enum:
          - android
          - ios
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDefault'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseDefaultUpdate'
  /api/v1/packages/{id}/deletion-impact:
    get:
      operationId: package_deletion_impact
      tags:
      - PackageLibrary
      x-access: app-manager
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDeletionImpact'
  /api/v1/apps/{id}/distribution-statistics:
    get:
      operationId: get_app_distribution_statistics
      tags: [apps]
      x-access: app-manager
      summary: Formal distribution measurements observed by Fuma; never an install count
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: start_date
        in: query
        schema: {type: string, format: date}
        description: UTC inclusive date; defaults to 29 days ago.
      - name: end_date
        in: query
        schema: {type: string, format: date}
        description: UTC inclusive date; defaults to today. Maximum range 90 days.
      responses:
        '200':
          description: Daily and total counters; pre-upgrade grant timestamps are unknown and excluded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DistributionStatistics'}
        '401':
          description: Authentication required
        '403':
          description: Administrator required
        '404':
          description: App unavailable
        '422':
          description: Invalid date range
  /api/v1/settings/members:
    get:
      operationId: list_members
      tags: [Access]
      x-access: admin
      security:
      - SessionCookie: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Query'
      - name: role
        in: query
        schema:
          type: string
          enum: [admin, maintainer, downloader]
      - name: app_id
        in: query
        schema:
          type: string
          format: uuid
      - name: active
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Current identifiable members; restricted to global administrators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
  /api/v1/settings/members/{id}/roles:
    put:
      operationId: update_member_roles
      tags: [Access]
      x-access: admin
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRolesUpdate'
      responses:
        '200':
          description: Updated authorization; local rescue administrator is immutable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInfo'
  /api/v1/auth/sessions:
    get:
      operationId: list_own_sessions
      tags: [auth]
      x-access: session
      security: [{SessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Own sessions only; no session credentials or client fingerprints.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnSessionPage'}
        '401': {description: Authentication required}
  /api/v1/auth/sessions/revoke-others:
    post:
      operationId: revoke_other_sessions
      tags: [auth]
      x-access: session
      security: [{SessionCookie: []}]
      parameters:
      - $ref: '#/components/parameters/CSRF'
      responses:
        '200':
          description: Other currently active sessions revoked; current session remains active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionRevocation'}
        '401': {description: Authentication required}
        '403': {description: CSRF validation failed}
components:
  schemas:
    AvailableStorageItem:
      type: object
      additionalProperties: false
      required: [id, name, provider, read_mode, is_default]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        provider: {type: string, enum: [cos, oss]}
        read_mode: {type: string, enum: [private, public]}
        is_default: {type: boolean}
    AvailableStorage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AvailableStorageItem'
    PackageStorageBindingInput:
      type: object
      additionalProperties: false
      required: [storage_location_id, object_prefix]
      properties:
        storage_location_id: {type: string, format: uuid}
        object_prefix:
          type: string
          minLength: 1
          maxLength: 200
          description: App-relative object prefix without a leading or trailing slash.
    PackageStorageBinding:
      type: object
      additionalProperties: false
      required: [channel, storage_location_id, object_prefix, revision, storage]
      properties:
        channel: {type: string, enum: [debug, release]}
        storage_location_id: {type: string, format: uuid}
        object_prefix: {type: string}
        revision: {type: integer, minimum: 1}
        storage:
          $ref: '#/components/schemas/AvailableStorageItem'
    PackageStorageBindings:
      type: object
      additionalProperties: false
      required: [app_id, app_revision, debug, release]
      properties:
        app_id: {type: string, format: uuid}
        app_revision: {type: integer, minimum: 1}
        debug:
          anyOf:
          - $ref: '#/components/schemas/PackageStorageBinding'
          - type: 'null'
        release:
          anyOf:
          - $ref: '#/components/schemas/PackageStorageBinding'
          - type: 'null'
    PackageStorageBindingsUpdate:
      type: object
      additionalProperties: false
      required: [debug, release]
      properties:
        debug:
          anyOf:
          - $ref: '#/components/schemas/PackageStorageBindingInput'
          - type: 'null'
        release:
          anyOf:
          - $ref: '#/components/schemas/PackageStorageBindingInput'
          - type: 'null'
    OwnSession:
      type: object
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [local, feishu]}
        created_at: {type: string, format: date-time}
        authenticated_at: {type: [string, 'null'], format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        current: {type: boolean}
        state: {type: string, enum: [active, expired, revoked]}
      required: [id, kind, created_at, authenticated_at, expires_at, revoked_at, current, state]
    OwnSessionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/OwnSession'}
        page: {type: integer}
        page_size: {type: integer}
        total: {type: integer}
      required: [items, page, page_size, total]
    SessionRevocation:
      type: object
      additionalProperties: false
      properties:
        revoked_count: {type: integer, minimum: 0}
      required: [revoked_count]
    DistributionCounters:
      type: object
      additionalProperties: false
      properties:
        grant_count:
          type: integer
          minimum: 0
        local_get_requests:
          type: integer
          minimum: 0
        local_head_requests:
          type: integer
          minimum: 0
        partial_get_requests:
          type: integer
          minimum: 0
        interrupted_get_requests:
          type: integer
          minimum: 0
        observed_bytes:
          type: integer
          minimum: 0
      required: [grant_count, local_get_requests, local_head_requests, partial_get_requests, interrupted_get_requests, observed_bytes]
    DistributionDay:
      type: object
      additionalProperties: false
      properties:
        date: {type: string, format: date}
        grant_count:
          type: integer
          minimum: 0
        local_get_requests:
          type: integer
          minimum: 0
        local_head_requests:
          type: integer
          minimum: 0
        partial_get_requests:
          type: integer
          minimum: 0
        interrupted_get_requests:
          type: integer
          minimum: 0
        observed_bytes:
          type: integer
          minimum: 0
      required: [date, grant_count, local_get_requests, local_head_requests, partial_get_requests, interrupted_get_requests, observed_bytes]
    DistributionStatistics:
      type: object
      additionalProperties: false
      properties:
        app_id: {type: string, format: uuid}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        totals: {$ref: '#/components/schemas/DistributionCounters'}
        days:
          type: array
          items: {$ref: '#/components/schemas/DistributionDay'}
      required: [app_id, start_date, end_date, totals, days]
    DependencyChecks:
      properties:
        database:
          enum:
          - ok
          - unavailable
          title: Database
          type: string
        redis:
          enum:
          - ok
          - unavailable
          title: Redis
          type: string
      required:
      - database
      - redis
      title: DependencyChecks
      type: object
    ErrorDetail:
      properties:
        code:
          title: Code
          type: string
        field_errors:
          items:
            $ref: '#/components/schemas/FieldError'
          title: Field Errors
          type: array
        message:
          title: Message
          type: string
        retryable:
          default: false
          title: Retryable
          type: boolean
      required:
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          title: Request Id
          type: string
      required:
      - error
      - request_id
      title: ErrorResponse
      type: object
    FieldError:
      properties:
        field:
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - message
      title: FieldError
      type: object
    LivenessResponse:
      properties:
        service:
          const: fuma-api
          default: fuma-api
          title: Service
          type: string
        status:
          const: ok
          default: ok
          title: Status
          type: string
      title: LivenessResponse
      type: object
    ReadinessResponse:
      properties:
        checks:
          $ref: '#/components/schemas/DependencyChecks'
        status:
          enum:
          - ok
          - degraded
          title: Status
          type: string
      required:
      - status
      - checks
      title: ReadinessResponse
      type: object
    BootstrapStatus:
      type: object
      additionalProperties: false
      properties:
        initialized:
          type: boolean
        sso_enabled:
          type: boolean
      required:
      - initialized
      - sso_enabled
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          const: admin
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
      - username
      - password
    PasswordRequest:
      type: object
      additionalProperties: false
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 6
          maxLength: 128
          writeOnly: true
      required:
      - old_password
      - new_password
    MemberRolesUpdate:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [admin, maintainer, downloader]
        managed_app_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
        active:
          type: boolean
      required: [role, managed_app_ids, active]
    MemberInfo:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [local, feishu]
        display_name:
          type: string
        tenant_key:
          type: [string, 'null']
        provider_app_id:
          type: [string, 'null']
        open_id:
          type: [string, 'null']
        role:
          type: string
          enum: [admin, maintainer, downloader]
        managed_app_ids:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
        permission_revision:
          type: integer
          minimum: 1
        identity_verified:
          type: boolean
        permission_changed_at:
          type: [string, 'null']
          format: date-time
      required: [id, kind, display_name, tenant_key, provider_app_id, open_id, role, managed_app_ids, active, permission_revision, identity_verified, permission_changed_at]
    MemberPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberInfo'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
      required: [items, total, page, page_size]
    SessionUser:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - local
          - feishu
        display_name: &id004
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
          - admin
          - maintainer
          - downloader
        managed_app_ids:
          type: array
          default: []
          items:
            type: string
            format: uuid
        active:
          type: boolean
          default: true
        permission_revision:
          type: integer
          default: 1
          minimum: 1
        tenant_key:
          anyOf:
          - type: string
          - type: 'null'
        must_change_password:
          type: boolean
          description: Auto-generated local admin password must be changed before using administrative
            APIs. False for Feishu users.
      required:
      - id
      - kind
      - display_name
      - role
      - tenant_key
      - must_change_password
    SessionResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrf_token:
          type: string
        expires_at: *id003
      required:
      - user
      - csrf_token
      - expires_at
    BrowserContext:
      type: object
      additionalProperties: false
      properties:
        eligibility_expires_at:
          type: [string, 'null']
          format: date-time
          description: Feishu qualification expiry for automatic OAuth revalidation. Null for local administrators and anonymous sessions.
        authenticated:
          type: boolean
        viewer_key:
          type: string
        csrf_token:
          type: string
        user:
          anyOf:
          - $ref: '#/components/schemas/SessionUser'
          - type: 'null'
      required:
      - authenticated
      - viewer_key
      - csrf_token
      - user
    AllowedPackageId:
      type: object
      additionalProperties: false
      description: Future package ingestion policy. Preserve original casing; compare iOS identifiers
        case-insensitively. Android uses applicationId syntax. No wildcards. Scope is platform and mode.
      properties:
        platform:
          type: string
          enum: [android, ios]
        mode:
          type: string
          enum: [debug, release]
        identifier:
          type: string
          minLength: 1
          maxLength: 255
      required: [platform, mode, identifier]
    AppCreate:
      type: object
      additionalProperties: false
      properties:
        icon_data:
          type: string
          maxLength: 90000
          description: Optional inline PNG, JPEG or WebP data URL, decoded maximum 64 KiB. Empty string clears the icon; omission preserves it on update.
        disabled_platforms:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [android, ios]
          description: Selected platforms paused for new ingestion, publication and download grants. Existing history and short-lived grants remain unchanged. Defaults to empty.
        name: *id004
        public_slug:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])$
        description: &id005
          type: string
          maxLength: 2000
        platforms:
          type: array
          items: *id002
          minItems: 1
          maxItems: 2
          uniqueItems: true
        allowed_package_ids:
          type: array
          maxItems: 80
          items:
            $ref: '#/components/schemas/AllowedPackageId'
          description: Optional initial configuration; empty scopes remain unconfigured. Does not
            validate or reclassify existing M1 Debug entries.
      required:
      - name
      - public_slug
      - platforms
    AppUpdate:
      type: object
      additionalProperties: false
      properties:
        icon_data:
          type: string
          maxLength: 90000
          description: Optional inline PNG, JPEG or WebP data URL, decoded maximum 64 KiB. Empty string clears the icon; omission preserves it on update.
        disabled_platforms:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [android, ios]
          description: Selected platforms paused for new ingestion, publication and download grants. Existing history and short-lived grants remain unchanged. Defaults to empty.
        name: *id004
        description: *id005
        platforms:
          type: array
          items: *id002
          minItems: 1
          maxItems: 2
          uniqueItems: true
        enabled:
          type: boolean
        allowed_package_ids:
          type: array
          maxItems: 80
          items:
            $ref: '#/components/schemas/AllowedPackageId'
          description: Replace the full set; omission preserves it, [] clears it. Only selected
            platforms are accepted. Removing a platform clears its configuration, but existing
            Debug entries or unfinished App tasks block removal with PLATFORM_IN_USE.
      required: []
    RepositoryBinding:
      type: object
      additionalProperties: false
      properties:
        connector_id: *id001
        repository_id: &id008
          type: string
          pattern: ^[0-9]+$
        full_name:
          type: string
        private:
          type: boolean
      required:
      - connector_id
      - repository_id
      - full_name
      - private
    RepositoryBindRequest:
      type: object
      additionalProperties: false
      properties:
        connector_id: *id001
        full_name:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          maxLength: 201
      required:
      - connector_id
      - full_name
    App:
      type: object
      additionalProperties: false
      properties:
        icon_data:
          type: string
          maxLength: 90000
          description: Optional inline PNG, JPEG or WebP data URL, decoded maximum 64 KiB. Empty string clears the icon; omission preserves it on update.
        disabled_platforms:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [android, ios]
          description: Selected platforms paused for new ingestion, publication and download grants. Existing history and short-lived grants remain unchanged. Defaults to empty.
        package_count:
          type: integer
          minimum: 0
          description: Formal package records excluding physically deleted records.
        publication_count:
          type: integer
          minimum: 0
          description: All formal publication records including draft and historical publications.
        id: *id001
        created_at: *id003
        updated_at: *id003
        revision: &id007
          type: integer
          minimum: 1
        name: *id004
        public_slug:
          type: string
        description: *id005
        platforms:
          type: array
          items: *id002
        enabled:
          type: boolean
        repository:
          anyOf:
          - $ref: '#/components/schemas/RepositoryBinding'
          - type: 'null'
        debug_entry_count:
          type: integer
          minimum: 0
        allowed_package_ids:
          type: array
          items:
            $ref: '#/components/schemas/AllowedPackageId'
        archived_at:
          type: [string, "null"]
          format: date-time
      required:
      - id
      - created_at
      - updated_at
      - revision
      - name
      - public_slug
      - description
      - platforms
      - enabled
      - repository
      - debug_entry_count
      - allowed_package_ids
    AppPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - page_size
      - total
    ConnectorCreate:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        token: &id006
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
        enabled:
          type: boolean
      required:
      - name
      - token
    ConnectorUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        token: *id006
        enabled:
          type: boolean
      required: []
    Connector:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        has_token:
          type: boolean
        github_login:
          anyOf:
          - type: string
          - type: 'null'
        last_tested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        last_test_status:
          type: string
          enum:
          - untested
          - ok
          - failed
        last_error_code:
          anyOf:
          - type: string
          - type: 'null'
        auth_kind:
          type: string
          enum:
          - pat
          - github_app
        app_id:
          anyOf:
          - type: string
          - type: 'null'
        installation_id:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - created_at
      - updated_at
      - revision
      - name
      - enabled
      - has_token
