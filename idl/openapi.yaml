openapi: 3.1.0
info:
  title: Fuma M1 API
  version: 1.0.0
  description: Design-first M1 contract. YAML is authoritative; implementation coverage is checked separately.
    All timestamps UTC. Provider IDs are decimal strings. Error bodies never contain provider payloads
    or credentials.
servers:
- url: /
paths:
  /api/v1/docs/github-actions:
    get:
      operationId: get_github_actions_document
      summary: Public GitHub Actions integration Markdown
      x-access: public
      parameters:
      - name: rule_id
        in: query
        required: false
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Generic integration instructions with an optional caller-supplied callback UUID
          content:
            text/markdown:
              schema: {type: string}
        '422':
          description: Invalid UUID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/apps/{id}/available-storage:
    get:
      operationId: list_available_storage
      summary: Available storage summaries for an authorized application
      x-access: app-manager
      tags: [apps]
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Enabled, verified storage without provider configuration or credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableStorage'
        '403':
          description: Application management permission required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/apps/{id}/package-storage:
    get:
      operationId: get_app_package_storage
      summary: Get Debug and Release storage bindings for an application
      x-access: app-manager
      tags: [apps]
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current per-channel storage bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageStorageBindings'
        '401': {description: Authentication required}
        '403':
          description: Application management permission required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource not available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    put:
      operationId: update_app_package_storage
      summary: Replace Debug and Release storage bindings for an application
      x-access: app-manager
      tags: [apps]
      security:
      - SessionCookie: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageStorageBindingsUpdate'
      responses:
        '200':
          description: Updated per-channel storage bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageStorageBindings'
          headers:
            ETag:
              schema: {type: string}
              description: Quoted application revision
        '401': {description: Authentication required}
        '403':
          description: Not allowed or invalid CSRF
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Resource not available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Storage location is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '412':
          description: Revision mismatch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Invalid prefix or overlapping same-bucket bindings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /api/v1/health/live:
    get:
      description: Process liveness only; does not imply integrations or business features are ready.
      operationId: get_liveness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Liveness
      tags:
      - health
  /api/v1/health/ready:
    get:
      description: Check connectivity only, without disclosing connection strings or errors.
      operationId: get_readiness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Content
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Dependency unavailable
      summary: Readiness
      tags:
      - health
  /api/v1/auth/bootstrap-status:
    get:
      operationId: get_bootstrap_status
      tags:
      - auth
      summary: get bootstrap status
      description: Read initialization and SSO status. Admin is created once during API startup; the initial
        password is emitted to API startup logs only on creation. No public initialization endpoint exists.
