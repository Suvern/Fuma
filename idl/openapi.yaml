          description: Internal Server Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Dependency unavailable
      summary: Readiness
      tags:
      - health
  /api/v1/auth/bootstrap-status:
    get:
      operationId: get_bootstrap_status
      tags:
      - auth
      summary: get bootstrap status
      description: Read initialization and SSO status. Admin is created once during API startup; the initial
        password is emitted to API startup logs only on creation. No public initialization endpoint exists.
