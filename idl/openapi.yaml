components:
  schemas:
    DependencyChecks:
      properties:
        database:
          enum:
          - ok
          - unavailable
          title: Database
          type: string
        redis:
          enum:
          - ok
          - unavailable
          title: Redis
          type: string
      required:
      - database
      - redis
      title: DependencyChecks
      type: object
    ErrorDetail:
      properties:
        code:
          title: Code
          type: string
        field_errors:
          items:
            $ref: '#/components/schemas/FieldError'
          title: Field Errors
          type: array
        message:
          title: Message
          type: string
        retryable:
          default: false
          title: Retryable
          type: boolean
      required:
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          title: Request Id
          type: string
      required:
      - error
      - request_id
      title: ErrorResponse
      type: object
    FieldError:
      properties:
        field:
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - message
      title: FieldError
      type: object
    LivenessResponse:
      properties:
        service:
          const: fuma-api
          default: fuma-api
          title: Service
          type: string
        status:
          const: ok
          default: ok
          title: Status
          type: string
      title: LivenessResponse
      type: object
    ReadinessResponse:
      properties:
        checks:
          $ref: '#/components/schemas/DependencyChecks'
        status:
          enum:
          - ok
          - degraded
          title: Status
          type: string
      required:
      - status
      - checks
      title: ReadinessResponse
      type: object
    BootstrapStatus:
      type: object
      additionalProperties: false
      properties:
        initialized:
          type: boolean
        sso_enabled:
          type: boolean
      required:
      - initialized
      - sso_enabled
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          const: admin
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
      - username
      - password
    PasswordRequest:
      type: object
      additionalProperties: false
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
      - old_password
      - new_password
    SessionUser:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        kind:
          type: string
          enum:
          - local
          - feishu
        display_name: &id004
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum:
          - admin
          - downloader
        tenant_key:
          anyOf:
          - type: string
          - type: 'null'
        must_change_password:
          type: boolean
          description: Auto-generated local admin password must be changed before using administrative
            APIs. False for Feishu users.
      required:
      - id
      - kind
      - display_name
      - role
      - tenant_key
      - must_change_password
    SessionResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrf_token:
          type: string
        expires_at: *id003
      required:
      - user
      - csrf_token
      - expires_at
    BrowserContext:
      type: object
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        viewer_key:
          type: string
        csrf_token:
          type: string
        user:
          anyOf:
          - $ref: '#/components/schemas/SessionUser'
          - type: 'null'
      required:
      - authenticated
      - viewer_key
      - csrf_token
      - user
    AllowedPackageId:
      type: object
      additionalProperties: false
      description: Future package ingestion policy. Preserve original casing; compare iOS identifiers
        case-insensitively. Android uses applicationId syntax. No wildcards. Scope is platform and mode.
      properties:
        platform:
          type: string
          enum: [android, ios]
        mode:
          type: string
          enum: [debug, release]
        identifier:
          type: string
          minLength: 1
          maxLength: 255
      required: [platform, mode, identifier]
    AppCreate:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        public_slug:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])$
        description: &id005
          type: string
          maxLength: 2000
        platforms:
          type: array
          items: *id002
          minItems: 1
          maxItems: 2
          uniqueItems: true
        allowed_package_ids:
          type: array
          maxItems: 80
          items:
            $ref: '#/components/schemas/AllowedPackageId'
          description: Optional initial configuration; empty scopes remain unconfigured. Does not
            validate or reclassify existing M1 Debug entries.
      required:
      - name
      - public_slug
      - platforms
    AppUpdate:
      type: object
      additionalProperties: false
      properties:
        name: *id004
        description: *id005
        platforms:
          type: array
          items: *id002
          minItems: 1
          maxItems: 2
          uniqueItems: true
        enabled:
          type: boolean
        allowed_package_ids:
          type: array
          maxItems: 80
          items:
            $ref: '#/components/schemas/AllowedPackageId'
          description: Replace the full set; omission preserves it, [] clears it. Only selected
            platforms are accepted. Removing a platform clears its configuration, but existing
            Debug entries or unfinished App tasks block removal with PLATFORM_IN_USE.
      required: []
    RepositoryBinding:
      type: object
      additionalProperties: false
      properties:
        connector_id: *id001
        repository_id: &id008
          type: string
          pattern: ^[0-9]+$
        full_name:
          type: string
        private:
          type: boolean
      required:
      - connector_id
      - repository_id
      - full_name
      - private
    RepositoryBindRequest:
      type: object
      additionalProperties: false
      properties:
        connector_id: *id001
        full_name:
          type: string
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          maxLength: 201
      required:
      - connector_id
      - full_name
    App:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        created_at: *id003
        updated_at: *id003
        revision: &id007
          type: integer
          minimum: 1
        name: *id004
        public_slug:
          type: string
        description: *id005
        platforms:
          type: array
          items: *id002
        enabled:
          type: boolean
        repository:
          anyOf:
          - $ref: '#/components/schemas/RepositoryBinding'
          - type: 'null'
        debug_entry_count:
          type: integer
          minimum: 0
        allowed_package_ids:
          type: array
          items:
            $ref: '#/components/schemas/AllowedPackageId'
      required:
      - id
      - created_at
      - updated_at
      - revision
      - name
      - public_slug
      - description
      - platforms
      - enabled
      - repository
      - debug_entry_count
      - allowed_package_ids
    AppPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/App'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - page_size
      - total
    ConnectorCreate:
