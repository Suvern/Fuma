name: M1 checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: fuma
          POSTGRES_DB: fuma_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fuma -d fuma_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FUMA_TEST_DATABASE_URL: postgresql+psycopg://fuma@127.0.0.1:55432/fuma_test
      FUMA_TEST_DATABASE_ALLOW_CREATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
      - run: make setup
      - run: make check
